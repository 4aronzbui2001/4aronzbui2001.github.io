<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Calculate Wages</title>
    <script src="code.js" defer></script>
</head>
<body>
    <h1>Please enter your data:</h1>
    <h1>Normal Hours:</h1>
    <input type="number" id="normal_Hours" placeholder="Enter normal hours">

    <h1>Normal Rate:</h1>
    <input type="number" id="normal_Rate" placeholder="Enter normal rate">

    <h1>Overtime Rate:</h1>
    <input type="number" id="overtime_Rate" placeholder="Enter overtime rate">

    <h1>Hours Worked:</h1>
    <input type="number" id="hours_Worked" placeholder="Enter hours worked">
    
    <h1>You Earned:</h1>
    <h1 id="result"></h1>
    <button id="btn">Calculate</button>
</body>
</html>
